[project]
name = "jdix-sandbox"
version = "0.1.0"
description = "Python client for jdix-sandbox: isolated code execution for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
