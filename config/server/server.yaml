# jdix-server: the tenant API and the sandbox data plane, one binary.
#
# --role=all serves both from one Pod, on two ports. It is the right shape at
# this scale, and it is a deployment decision, not an architectural one: the
# same image with --role=server and --role=gateway in two Deployments splits
# them apart the moment their traffic profiles justify it. See the note at the
# bottom of this file.
#
# The gateway half reverse-proxies straight to Pod IPs. Sandbox Pods
# deliberately have no Service — one per tenant request would add a Service and
# an Endpoints object per sandbox, and endpoint propagation alone can take
# longer than the whole warm-pool bind it would be sitting behind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jdix-server
  namespace: jdix-system
---
# Neither role writes a Pod. Exactly one component decides which Sandbox owns
# which Pod, and that is jdix-controller, whose ClusterRole is separate.
#
# list and watch appear on every resource because the client is informer-backed:
# a cached Get starts an informer, which cannot run without them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jdix-server
rules:
  - apiGroups: ["sandbox.jdix.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["sandbox.jdix.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  # Approving a warm-up request writes a pool.
  - apiGroups: ["sandbox.jdix.io"]
    resources: ["sandboxpools"]
    verbs: ["get", "list", "watch", "create", "update"]
  # Nothing here for pods/proxy: in-cluster the gateway dials Pod IPs directly.
  # --sandbox-transport=apiserver-proxy is for running outside the cluster on a
  # human's kubeconfig; granting it to this ServiceAccount would route the whole
  # data plane through the API server, which is the one thing that mode warns
  # against.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jdix-server
subjects:
  - kind: ServiceAccount
    name: jdix-server
    namespace: jdix-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jdix-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jdix-server
  namespace: jdix-system
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: jdix-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jdix-server }
    spec:
      serviceAccountName: jdix-server
      # A PTY session ends when someone stops typing into it, so a rolling
      # update has to be given time to drain rather than cutting them off.
      # This is the cost of --role=all: a control-plane change now restarts
      # the process holding every live sandbox stream.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: registry.internal/jdix/server:dev
          args:
            - --role=all
            - --addr=:8000
            - --data-addr=:8090
            # Path routing: every sandbox under one hostname, so one
            # certificate and one DNS record. --public-base is omitted on
            # purpose; the origin is read off each request, which is correct
            # behind an Ingress that preserves Host.
            - --route-mode=path
            - --path-prefix=/s
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: jdix-database, key: url }
          ports:
            - { name: control, containerPort: 8000 }
            - { name: data, containerPort: 8090 }
          livenessProbe:
            httpGet: { path: /healthz, port: control }
            initialDelaySeconds: 10
          readinessProbe:
            # Deliberately the data port: with --role=all a Pod that cannot
            # proxy sandboxes should not be taking control-plane traffic
            # either, and a probe on one port says nothing about the other.
            httpGet: { path: /healthz, port: data }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: jdix-server
  namespace: jdix-system
spec:
  selector: { app.kubernetes.io/name: jdix-server }
  ports:
    - { name: control, port: 8000, targetPort: control }
    - { name: data, port: 8090, targetPort: data }
#
# To split them later, replace the Deployment above with two of the same image:
#
#   name: jdix-apiserver   args: [--role=server,  --addr=:8000]
#   name: jdix-gateway     args: [--role=gateway, --data-addr=:8090]
#
# and give each its own Service. The Ingress in this directory routes by path,
# so it keeps working with either shape — only the backend service names change.
# A --role=gateway Pod needs no DATABASE_URL: it never opens the store.
