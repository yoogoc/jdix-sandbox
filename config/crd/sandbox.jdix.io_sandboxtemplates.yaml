---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: sandboxtemplates.sandbox.jdix.io
spec:
  group: sandbox.jdix.io
  names:
    kind: SandboxTemplate
    listKind: SandboxTemplateList
    plural: sandboxtemplates
    shortNames:
    - sbxtpl
    singular: sandboxtemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.admission
      name: Admission
      type: string
    - jsonPath: .spec.minIsolationTier
      name: MinTier
      type: string
    - jsonPath: .status.hash
      name: Hash
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SandboxTemplate is a reusable blueprint for sandboxes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SandboxTemplateSpec is the blueprint.
            properties:
              defaultTTLSeconds:
                default: 1800
                format: int32
                type: integer
              filesystemDefaults:
                description: FilesystemDefaults are applied to sandboxes that do not
                  override them.
                properties:
                  allowSystemPaths:
                    items:
                      type: string
                    type: array
                  workspace:
                    description: Workspace is the sandbox's writable scratch directory.
                    properties:
                      path:
                        default: /workspace
                        type: string
                      sizeLimit:
                        description: SizeLimit is applied to the backing emptyDir.
                        type: string
                    type: object
                type: object
              image:
                description: ImageSpec pins the sandbox image.
                properties:
                  pullSecretRef:
                    description: |-
                      LocalObjectReference contains enough information to let you locate the
                      referenced object inside the same namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  ref:
                    description: |-
                      Ref is stored as a digest, not a tag. Admission resolves the tag once, at
                      template creation, so a warm pool can never end up holding two different
                      builds of the same "version".
                    minLength: 1
                    type: string
                required:
                - ref
                type: object
              maxTTLSeconds:
                default: 14400
                format: int32
                type: integer
              minIsolationTier:
                default: userns
                description: |-
                  MinIsolationTier is a floor, never a preference: a node that measures
                  below it is not used, even if that means a cold start or a failure.
                  Silently degrading an isolation guarantee is worse than not serving.
                enum:
                - userns
                - capadmin
                - chroot
                type: string
              network:
                description: NetworkSpec is the template's egress posture.
                properties:
                  allowCIDRs:
                    items:
                      type: string
                    type: array
                  allowedFQDN:
                    items:
                      type: string
                    type: array
                  denyCIDRs:
                    items:
                      type: string
                    type: array
                  egress:
                    default: restricted
                    description: EgressMode is the default outbound posture for sandboxes
                      from this template.
                    enum:
                    - open
                    - restricted
                    - none
                    type: string
                type: object
              podOverrides:
                description: |-
                  PodOverrides is merged into the generated Pod. Security-relevant fields
                  are re-applied by the controller afterwards, so this cannot be used to
                  weaken them.

                  The schema is deliberately not expanded. Embedding a full PodSpec would
                  add roughly eight thousand lines to this CRD, which pushes `kubectl apply`
                  past its 256KB last-applied-configuration annotation and makes the CRD
                  itself unpleasant to install. Validation of what actually matters happens
                  in the controller, which has to re-apply the security fields regardless.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              resources:
                description: |-
                  Resources is what one sandbox Pod requests and is limited to. Warm Pods
                  request the same: understating it to save money oversubscribes the node
                  and the tenant's workload is what gets OOM-killed.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtimeClassName:
                description: |-
                  RuntimeClassName is reserved for gVisor or Kata. Empty today; filling it
                  in later needs a node pool, not an architecture change.
                type: string
              volumes:
                items:
                  description: |-
                    TemplateVolume declares storage that sandboxes may mount subpaths of.

                    It references a PVC that already exists in the tenant's namespace. There is
                    no inline CSI configuration: several drivers let volumeAttributes name an
                    arbitrary server and export path, which would hand a tenant the ability to
                    mount anything at all.
                  properties:
                    claimName:
                      minLength: 1
                      type: string
                    mountPath:
                      description: |-
                        MountPath is where the volume appears inside the Pod, outside the sandbox
                        namespace. Sandboxes only ever see subpaths of it.
                      type: string
                    name:
                      minLength: 1
                      type: string
                    readOnly:
                      type: boolean
                  required:
                  - claimName
                  - name
                  type: object
                type: array
            required:
            - image
            type: object
          status:
            description: SandboxTemplateStatus is the observed state.
            properties:
              admission:
                description: AdmissionState records how far a template got through
                  image and volume checks.
                enum:
                - Pending
                - PendingReview
                - Approved
                - Rejected
                type: string
              admissionReason:
                description: AdmissionReason is shown to the tenant verbatim, so it
                  says what to fix.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hasVolumes:
                description: |-
                  HasVolumes drives review: a template with a volume implies a warm pool,
                  and a warm pool costs the platform money, so it needs a human.
                type: boolean
              hash:
                description: |-
                  Hash changes whenever anything that affects a Pod changes. Warm Pods carry
                  it as a label, which is how a rolling update knows what is stale.
                type: string
              resolvedDigest:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
