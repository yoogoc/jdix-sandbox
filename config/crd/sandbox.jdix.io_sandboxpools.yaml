kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: sandboxpools.sandbox.jdix.io
spec:
  group: sandbox.jdix.io
  names:
    kind: SandboxPool
    listKind: SandboxPoolList
    plural: sandboxpools
    shortNames:
    - sbxpool
    singular: sandboxpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateRef
      name: Template
      type: string
    - jsonPath: .spec.replicas
      name: Want
      type: integer
    - jsonPath: .status.idle
      name: Idle
      type: integer
    - jsonPath: .status.bound
      name: Bound
      type: integer
    - jsonPath: .status.notReady
      name: NotReady
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SandboxPool maintains warm Pods for a template.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SandboxPoolSpec keeps warm Pods ready for a template.

              Replicas is written by platform administrators, never by tenants: the
              platform pays for warm capacity, so allowing a tenant to set it would let any
              one of them drain the budget.
            properties:
              autoscale:
                description: AutoscaleSpec sizes the pool from recent demand.
                properties:
                  enabled:
                    description: |-
                      Enabled is off by default: a fixed pool is predictable, and predictable is
                      what a cost budget needs first.
                    type: boolean
                  targetIdleSeconds:
                    default: 60
                    description: TargetIdleSeconds is how much future demand the idle
                      pool should cover.
                    format: int32
                    type: integer
                type: object
              idleTTLSeconds:
                default: 3600
                description: |-
                  IdleTTLSeconds recycles Pods that have been waiting too long, so a pool
                  does not quietly go on serving a months-old image layer.
                format: int32
                type: integer
              maxReplicas:
                format: int32
                minimum: 0
                type: integer
              maxSurge:
                default: 3
                description: MaxSurge bounds how many Pods a template rollout replaces
                  at once.
                format: int32
                type: integer
              minReplicas:
                format: int32
                minimum: 0
                type: integer
              notReadyTimeoutSeconds:
                default: 300
                description: |-
                  NotReadyTimeoutSeconds is how long a warm Pod may take to become ready
                  before it is treated as stuck.

                  Templates with volumes need a generous value. A CSI attach can take tens
                  of seconds, and a timeout shorter than the attach deletes Pods that were
                  about to succeed — which produces a pool that rebuilds forever and never
                  fills. This is the single easiest way to break a warm pool.
                format: int32
                type: integer
              replicas:
                format: int32
                minimum: 0
                type: integer
              templateRef:
                minLength: 1
                type: string
            required:
            - replicas
            - templateRef
            type: object
          status:
            description: SandboxPoolStatus is the observed state.
            properties:
              bound:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              idle:
                format: int32
                type: integer
              idleByTier:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  IdleByTier is the pool's real currency: a Pod only counts for a template
                  whose minIsolationTier its node can actually meet.
                type: object
              notReady:
                description: |-
                  NotReady is warm Pods still starting; a number that stays high usually
                  means an attach or pull problem, not a busy cluster.
                format: int32
                type: integer
              stale:
                description: Stale is warm Pods running a superseded template hash.
                format: int32
                type: integer
              templateHash:
                type: string
            required:
            - bound
            - idle
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
