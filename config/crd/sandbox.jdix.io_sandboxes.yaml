---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: sandboxes.sandbox.jdix.io
spec:
  group: sandbox.jdix.io
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    shortNames:
    - sbx
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.templateRef
      name: Template
      type: string
    - jsonPath: .status.isolationTier
      name: Tier
      type: string
    - jsonPath: .status.coldStart
      name: Cold
      type: boolean
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Sandbox is one isolated execution environment, backed by exactly one Pod for
          the whole of its life.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SandboxSpec is the desired state of a Sandbox.
            properties:
              env:
                items:
                  description: EnvVar is a plain environment entry. Anything sensitive
                    belongs in SecretRefs.
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              filesystem:
                description: |-
                  FilesystemSpec is what the sandbox is allowed to see. It is the sole input to
                  the bubblewrap argument generator, and it only exists once a sandbox is
                  created — which is why the namespace cannot be built during warm-up.
                properties:
                  allowSystemPaths:
                    description: AllowSystemPaths must be a subset of the platform
                      allowlist.
                    items:
                      type: string
                    type: array
                  hide:
                    description: Hide blanks a path that would otherwise be visible.
                    items:
                      type: string
                    type: array
                  mounts:
                    items:
                      description: Mount binds part of a declared volume into the
                        sandbox.
                      properties:
                        path:
                          pattern: ^/.*
                          type: string
                        readOnly:
                          type: boolean
                        source:
                          description: |-
                            MountSource names a volume the SandboxTemplate declared. There is no field
                            for a host path or for inline CSI attributes, and that is the point: a tenant
                            can only reach storage an administrator already approved.
                          properties:
                            subPath:
                              description: SubPath is resolved beneath the volume
                                root and may not escape it.
                              type: string
                            volume:
                              minLength: 1
                              type: string
                          required:
                          - volume
                          type: object
                      required:
                      - path
                      - source
                      type: object
                    maxItems: 32
                    type: array
                  workspace:
                    description: Workspace is the sandbox's writable scratch directory.
                    properties:
                      path:
                        default: /workspace
                        type: string
                      sizeLimit:
                        description: SizeLimit is applied to the backing emptyDir.
                        type: string
                    type: object
                type: object
              metadata:
                additionalProperties:
                  type: string
                description: Metadata is opaque tenant bookkeeping, echoed back on
                  reads.
                type: object
              secretRefs:
                items:
                  description: |-
                    SecretRef names a Secret whose contents execd injects into the sandbox's
                    environment in memory. Values never enter the Pod spec, so they do not appear
                    in `kubectl get pod -o yaml`.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              templateRef:
                minLength: 1
                type: string
              ttlSeconds:
                format: int32
                minimum: 1
                type: integer
            required:
            - templateRef
            type: object
          status:
            description: SandboxStatus is the observed state.
            properties:
              boundAt:
                format: date-time
                type: string
              coldStart:
                description: |-
                  ColdStart records whether the warm pool was missed. It is the most direct
                  signal that a pool is undersized, so it is surfaced rather than logged.
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                type: string
              expiresAt:
                format: date-time
                type: string
              isolationTier:
                description: IsolationTier is how strongly a node can separate the
                  sandbox from the Pod.
                enum:
                - userns
                - capadmin
                - chroot
                type: string
              nodeName:
                type: string
              phase:
                description: SandboxPhase tracks a Sandbox through its life.
                enum:
                - Pending
                - Binding
                - Running
                - Expired
                - Failed
                - Terminating
                type: string
              podIP:
                type: string
              podName:
                type: string
              reason:
                description: Reason explains a Failed or Expired phase in words a
                  tenant can act on.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
