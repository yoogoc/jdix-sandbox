# Puts the setup-phase seccomp profile on every node.
#
# A Pod naming `localhostProfile: jdix/bwrap-setup.json` will not start until
# the file exists under the kubelet's seccomp root, and the failure is a
# CreateContainerError that says nothing about profiles. Copying it by hand
# works exactly once, on the node you remembered.
#
# The profile is the pinned Moby baseline with the syscalls bwrap needs for its
# own setup added back — clone, unshare, mount, umount2, pivot_root, chroot,
# setns — and nothing else. Regenerate with config/seccomp/generate.py. It is
# the outer half of the two-stage design: bwrap installs a second, tighter
# filter over every tenant descendant before jdix-init runs, so the permissions
# below exist only for the few milliseconds of setup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jdix-seccomp
  namespace: jdix-system
