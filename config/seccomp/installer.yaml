apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jdix-seccomp-installer
  namespace: jdix-system
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: jdix-seccomp-installer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jdix-seccomp-installer }
    spec:
      # Must reach every node that could run a sandbox, including ones carrying
      # taints for other reasons: a node without the profile accepts the Pod and
      # then fails to create the container.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 1
      volumes:
        - name: profiles
          configMap: { name: jdix-seccomp }
        - name: seccomp-root
          hostPath: { path: /var/lib/kubelet/seccomp, type: DirectoryOrCreate }
      containers:
        - name: install
          image: registry.internal/jdix/seccomp-installer:dev
          # Root, because the kubelet's seccomp root is root-owned. This is the
          # only privilege it takes: no host network, no host PID, one writable
          # directory, everything else dropped.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              case "$(uname -m)" in
                aarch64) src=bwrap-setup-arm64.json ;;
                x86_64)  src=bwrap-setup-amd64.json ;;
                *) echo "no profile for $(uname -m)" >&2; exit 1 ;;
              esac
              mkdir -p /host-seccomp/jdix
              # Written to a temporary name and renamed, so a kubelet reading
              # the profile never sees a half-written file.
              cp "/profiles/$src" /host-seccomp/jdix/.bwrap-setup.json.tmp
              chmod 0644 /host-seccomp/jdix/.bwrap-setup.json.tmp
              mv /host-seccomp/jdix/.bwrap-setup.json.tmp /host-seccomp/jdix/bwrap-setup.json
              echo "installed $src -> jdix/bwrap-setup.json"
              # Stays alive so the DaemonSet reports the node as covered, and so
              # a rollout reinstalls after the ConfigMap changes.
              exec sleep infinity
          volumeMounts:
            - { name: profiles, mountPath: /profiles, readOnly: true }
            - { name: seccomp-root, mountPath: /host-seccomp }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /host-seccomp/jdix/bwrap-setup.json"]
            initialDelaySeconds: 1
